<style>
:root{--anil:#4A2574;--anil2:#6A3D9A;--ouro:#C8A15A;--padilha:#B3121F;--preto:#141114;--branco:#FFFFFF;--conta:#9B78CC;--cafe:#241D2C;--muted:#66656E;--fundo:#F6F3FA;--linha:#E8E1F1;--ok:#2F7A4F;--alerta:#B3362F;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;--brand:"Cinzel","Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.5;color:var(--cafe);background:var(--fundo);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--conta);outline-offset:2px}
.carregando{text-align:center;padding:80px 20px;color:var(--muted)}

/* cabeçalho */
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--anil);color:var(--branco);box-shadow:0 2px 12px rgba(30,16,48,.25)}
.topo{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1080px;margin:0 auto}
.topo small{color:#DCCDEF;font-size:13px;display:block}
.topo h1{font-size:21px}
.logo-mini{width:44px;height:44px;border-radius:50%;background:#fff;flex:0 0 44px;box-shadow:0 0 0 2px var(--ouro)}
.btn-sair{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--branco);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.abas{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none;max-width:1080px;margin:0 auto}
.abas::-webkit-scrollbar{display:none}
.abas button{background:none;border:0;color:#DCCDEF;padding:10px 14px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;font-size:16px}
.abas button.on{color:var(--branco);border-bottom-color:var(--ouro)}
.pag{max-width:1080px;margin:0 auto;padding:20px 14px 80px}

/* blocos */
.sec{background:var(--branco);border-radius:18px;padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(74,37,116,.06)}
.sec>h2,.cal-cab h2{font-size:23px;color:var(--anil)}
.sec>h2{margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec>h2:not(:first-child){margin-top:22px}
.sec.destaque{box-shadow:inset 0 0 0 2px var(--conta)}
.sub{color:var(--muted);font-size:15px;margin:-4px 0 12px}
.item{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-top:1px solid var(--linha)}
.item-p{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 240px}
.meta{color:var(--muted);font-size:15px}
.item-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--anil);color:var(--branco);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec2{background:transparent;color:var(--anil);box-shadow:inset 0 0 0 1.5px var(--anil)}
.btn.sec2:hover{background:#F4EFFA;filter:none}
.btn.perigo{background:var(--alerta)}
.btn.padilha{background:var(--padilha)}
.btn-ico{background:#F1EBF8;color:var(--anil);border:0;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-ico:hover{background:#E6DBF3}
.btn-ico:disabled{opacity:.35;cursor:default}
.btn-ico.ok{background:#DCEFE3;color:var(--ok)}
.btn-ico.perigo{background:#F6E1E0;color:var(--alerta)}
.btn-ico.marcado{background:var(--anil);color:var(--branco)}
.link{background:none;border:0;color:var(--anil);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.tag{align-self:flex-start;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:5px;display:inline-block}
.amarelo,.aberto{background:#F7EACB;color:#6E510C}.azul,.conferir{background:#EBE1F7;color:#4A2574}.verde,.pago{background:#DCEFE3;color:#22603D}.vermelho,.atrasado{background:#F6DCDA;color:#8E2A27}.cinza{background:#E6E6EA;color:#55555E}
.conta-tag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--c);margin:2px 0}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--fundo-n,var(--anil));color:var(--branco);border-radius:18px;margin-bottom:16px;overflow:hidden}
.numeros div{padding:16px 18px;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.numeros b{display:block;font-family:var(--serif);font-size:27px;font-weight:400}
.numeros span{color:rgba(255,255,255,.75);font-size:14px}
.faixa{background:#F7EACB;color:#5E450B;border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 16px}
.faixa.erro{background:#F6E1E0;color:#7E2421}
.vazio{color:var(--muted);font-style:italic;margin:6px 0}
.seg{display:flex;gap:6px;background:var(--branco);border-radius:999px;padding:5px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 18px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
.seg button.on{background:var(--c);color:var(--branco)}

/* agenda da casa */
.aviso{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--linha)}
.aviso-data{flex:0 0 58px;align-self:flex-start;text-align:center;border-radius:12px;background:var(--tipo);color:var(--branco);padding:8px 4px}
.aviso-data b{display:block;font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.05}
.aviso-data span{font-size:13px}
.aviso-c{flex:1;min-width:0}
.aviso-c .tipo{color:var(--tipo);font-weight:700;font-size:14px}
.aviso-c h3{font-size:20px;margin:2px 0}
.aviso-c p{margin:6px 0 0}
.aviso .item-a{margin-top:10px}
.pergunta{font-size:15px;font-weight:700;margin-right:2px}

/* formulários */
label,.rot{display:block;font-size:15px;font-weight:700;color:var(--anil);margin-bottom:12px}
.rot{margin-bottom:4px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;font-weight:400;color:var(--cafe)}
input:focus,select:focus,textarea:focus{border-color:var(--conta);outline:none;box-shadow:0 0 0 3px rgba(155,120,204,.3)}
input[type=file]{padding:9px}
label.chk{display:flex;align-items:flex-start;gap:10px;font-weight:400;color:var(--cafe)}
label.chk input{width:22px;height:22px;margin:1px 0 0;flex:0 0 22px}
label.chk small{color:var(--muted)}
.checks{border:1px solid var(--linha);border-radius:12px;padding:12px 12px 2px;margin-bottom:14px}
.dias-chk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.dias-chk label{display:flex;gap:6px;align-items:center;background:#F1EBF8;border-radius:999px;padding:6px 12px;margin:0;font-weight:400;color:var(--cafe)}
.dias-chk input{width:auto;margin:0}
.linha-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.linha-form label{flex:1 1 200px;margin:0}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);color:var(--cafe);background:var(--branco)}
dialog.largo{width:min(820px,calc(100% - 24px))}
dialog::backdrop{background:rgba(30,16,48,.55)}
dialog form{padding:22px}
dialog h2{color:var(--anil);font-size:24px;margin-bottom:14px}
.h-pres{font-family:var(--sans);font-size:16px;font-weight:700;color:var(--anil);margin:14px 0 2px}
.dlg-a{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:12px}
.dlg-a .perigo{margin-right:auto}
.login{max-width:420px;margin:32px auto;background:var(--branco);border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(74,37,116,.08)}
.login h2{color:var(--anil);font-size:26px;margin-bottom:6px;text-align:center}
.login .btn{width:100%}
.logo-login{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 16px;box-shadow:0 0 0 3px var(--ouro)}
.dica{color:var(--muted);font-size:14px;margin-bottom:0}

/* calendário financeiro (ano) */
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ano-nav{display:flex;align-items:center;gap:10px}
.ano-nav b{font-size:18px;color:var(--anil)}
.cal-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
.cal-ano{border-collapse:separate;border-spacing:4px;min-width:860px;width:100%}
.cal-ano th{font-size:13px;color:var(--muted);font-weight:700;text-align:center;padding:4px 2px}
.cal-ano thead th.mes-atual{color:var(--anil);background:#F1EBF8;border-radius:8px}
.cal-ano th[scope=row],.cal-ano thead th:first-child,.cal-ano tfoot th{position:sticky;left:0;background:var(--branco);z-index:1;text-align:left;min-width:150px;max-width:190px}
.nome-f{background:none;border:0;padding:4px 2px;text-align:left;font-weight:700;color:var(--anil);cursor:pointer;font-size:15px;line-height:1.25}
.nome-f:hover{text-decoration:underline}
.cel{width:100%;min-height:40px;border:0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px}
.cel:hover{filter:brightness(.95);box-shadow:inset 0 0 0 2px rgba(74,37,116,.25)}
.cel.vazia{background:#F7F4FB;color:#B4B8C6}
.cal-ano td.tot{font-size:14px;font-weight:700;color:var(--ok);text-align:right;padding:0 6px;white-space:nowrap}
.cal-ano .devendo,.cal-ano td.tot.devendo{color:var(--alerta)}
.cal-ano{table-layout:fixed}
.cal-ano thead th:first-child{width:170px}
.cal-ano thead th:last-child{width:120px}
.cal-ano tfoot td{font-size:13px;text-align:center;font-weight:700;color:var(--muted)}
.cal-ano tfoot td:last-child{text-align:right;padding-right:6px}
.cal-ano tfoot tr:first-child th,.cal-ano tfoot tr:first-child td{border-top:1px solid var(--linha);padding-top:8px}
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:14px;height:14px;border-radius:4px;display:inline-block}
.cal-filho{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--linha);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px}
.tile.agora{border-color:var(--anil);box-shadow:inset 0 0 0 1px var(--anil)}
.tile b{font-family:var(--serif);font-weight:400;color:var(--anil);font-size:17px}
.mini{font-size:13px;font-weight:700;border-radius:8px;padding:3px 8px}
.mini.vazia{background:#F7F4FB;color:#B4B8C6;font-weight:400}
.resumo-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.resumo-f div{background:#F7F4FB;border-radius:12px;padding:10px 12px}
.resumo-f b{display:block;font-family:var(--serif);font-weight:400;font-size:22px}
.resumo-f span{font-size:13px;color:var(--muted)}

/* calendário mensal (consultas) */
.cal-mes .sem,.cal-mes .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-mes .sem span{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:4px}
.dia{aspect-ratio:1/1;min-height:44px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;position:relative}
.dia span{font-weight:700;font-size:16px;color:var(--cafe)}
.dia i{font-style:normal;font-size:11px;font-weight:700;background:var(--anil);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.dia.hoje{border-color:var(--ouro)}
.dia.sel{background:var(--anil);border-color:var(--anil)}
.dia.sel span{color:#fff}.dia.sel i{background:var(--ouro);color:var(--anil)}
.dia.bloq{background:repeating-linear-gradient(135deg,#F7F4FB 0 6px,#E6E8EF 6px 12px)}
.dia:disabled{cursor:default;background:#F7F8FB;border-color:transparent}
.dia:disabled span{color:#B4B8C6;font-weight:400}
.dia.livre{border-color:#CDB6EA;background:#F5EFFC}
.dia.livre i{background:#EBE1F7;color:#4A2574}
.dia.livre.sel{background:var(--anil)}
.dia.livre.sel i{background:var(--ouro);color:var(--anil)}
.dia.lotado span{text-decoration:line-through}
.mes-nome{font-family:var(--serif);font-size:21px;color:var(--anil);font-weight:400}

/* contas do filho */
.contas{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.conta-card{background:var(--branco);border-radius:20px;padding:20px;border-top:6px solid var(--c);box-shadow:0 6px 20px rgba(74,37,116,.07);display:flex;flex-direction:column;gap:6px}
.conta-card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.conta-card header span:first-child{font-weight:700;color:var(--c)}
.conta-card .frase{margin:4px 0 0}
.conta-card .valor{font-family:var(--serif);font-size:40px;color:var(--c);margin:0;line-height:1.1}
.conta-card.em-dia .frase{font-family:var(--serif);font-size:22px;color:var(--ok)}
.conta-card .item-a{margin-top:8px}
.pix-linha{font-size:14px;color:var(--muted);margin:8px 0 0}
.recusa{background:#F6E1E0;color:#7E2421;border-radius:10px;padding:8px 10px;font-size:14px;margin:4px 0}
.saudacao{padding:4px 2px 16px}
.saudacao h2{font-size:30px;color:var(--anil)}
.saudacao p{margin:4px 0 0}
.pagar-total{text-align:center;margin:0 0 6px}
.pagar-total b{display:block;font-family:var(--serif);font-weight:400;font-size:38px;color:var(--c)}
.qr{display:flex;justify-content:center;margin:6px 0 12px}
.qr img{width:220px;height:220px;image-rendering:pixelated;border-radius:12px;border:1px solid var(--linha)}
.pix-chave{background:#F7F4FB;border-radius:12px;padding:12px;margin:10px 0;word-break:break-all}
.pix-chave span{display:block;font-size:13px;color:var(--muted)}
.comp-img{display:block;max-width:100%;max-height:60vh;margin:0 auto 12px;border-radius:12px;border:1px solid var(--linha)}

/* consulente */
.boas-vindas{display:flex;align-items:center;gap:18px;background:var(--anil);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px rgba(74,37,116,.2)}
.boas-vindas img{width:86px;height:86px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--ouro);flex:0 0 86px}
.boas-vindas h2{font-size:28px}
.boas-vindas p{margin:4px 0 0;color:#E3D8F2}
.passo{display:inline-grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;background:var(--ouro);color:var(--anil);font-family:var(--sans);font-size:16px;font-weight:700}
.escolhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.escolhas.horas{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.escolhas button{background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.escolhas button:hover{border-color:var(--conta)}
.escolhas.horas button{text-align:center;font-weight:700;font-size:18px;color:var(--anil);align-items:center;padding:12px 6px}
.escolhas button span{color:var(--muted);font-size:14px}
.escolhas button b{font-size:17px;color:var(--anil)}
.escolhas button.on{border-color:var(--anil);background:var(--anil);color:#fff}
.escolhas button.on b,.escolhas button.on span{color:#fff}
.legenda-c{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:10px 0 0}
.legenda-c i{width:14px;height:14px;border-radius:4px;background:#F5EFFC;border:1.5px solid #CDB6EA}
.form-cons .btn{width:100%}
.ticket{background:var(--branco);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(74,37,116,.12);margin-bottom:16px}
.ticket-topo{background:var(--anil);color:#fff;display:flex;align-items:center;gap:14px;padding:18px 20px}
.ticket-topo img{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ouro)}
.ticket-topo small{display:block;color:#DCCDEF;font-size:13px}
.ticket-topo b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;padding:20px}
.ticket dt{color:var(--muted);font-size:14px;padding-top:2px}
.ticket dd{margin:0;font-weight:700}
.ticket-corte{border-top:2px dashed var(--linha);margin:0 20px;position:relative}
.ticket-corte::before,.ticket-corte::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--fundo)}
.ticket-corte::before{left:-31px}.ticket-corte::after{right:-31px}
.ticket-rodape{padding:16px 20px 20px}
.ticket-rodape p{margin:0 0 10px}
.orient{background:#F7F4FB;border-radius:12px;padding:12px 14px;margin:0 0 12px}
.orient h3{font-size:18px;color:var(--anil)}
.orient p{margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--cafe);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;width:max-content;max-width:calc(100% - 32px);z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* acabamento */
.cab{border-bottom:1px solid rgba(200,161,90,.55)}
.topo small{font-family:var(--brand);letter-spacing:.06em;font-size:12px}
.topo h1{font-size:24px}
.sec>h2,.cal-cab h2{font-size:27px}
.numeros b,.resumo-f b,.tile b,.ticket-topo b,.aviso-data b,.pagar-total b,.mes-nome,.conta-card .valor{font-weight:600}
.numeros b{font-size:31px}.aviso-c h3{font-size:23px}.saudacao h2{font-size:36px}.boas-vindas h2{font-size:32px}.mes-nome{font-size:24px}
.btn{font-weight:500;letter-spacing:.01em}
.numeros{background:var(--fundo-n,linear-gradient(135deg,#3B1C60,#6A3D9A))}

/* tela de login */
.login-tela{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(420px,1fr);background:#fff}
.login-arte{background-position:right center;background-size:cover;background-repeat:no-repeat;position:relative;min-height:100vh}
.login-arte::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 93%,#fff 100%)}
.login-lado{display:flex;align-items:center;justify-content:center;padding:32px 28px;background:radial-gradient(120% 90% at 100% 0%,#EFE5FA 0,#fff 62%)}
.login-card{width:100%;max-width:450px;background:#fff;border:1px solid #E2D3F2;border-radius:20px;padding:40px 36px 30px;box-shadow:0 24px 60px rgba(74,37,116,.14)}
.marca-1{font-family:var(--brand);font-weight:600;font-size:25px;letter-spacing:.05em;color:var(--anil);text-align:center;text-transform:uppercase;line-height:1.25}
.marca-linha{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.marca-linha::before,.marca-linha::after{content:"";flex:1;height:1px;background:var(--ouro)}
.marca-linha span{font-family:var(--brand);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cafe);white-space:nowrap}
.login-portal{text-align:center;color:var(--anil2);margin:6px 0 28px;font-family:var(--serif);font-size:21px;font-weight:600}
.campo{position:relative;margin-bottom:16px}
.campo .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:#7A6890;pointer-events:none}
.campo input{margin:0;padding:15px 50px 15px 50px;border-radius:12px;border-color:#DCD0EA;font-size:17px}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:9px;cursor:pointer;color:#7A6890;border-radius:8px;display:flex}
.olho:hover{background:#F4EFFA}
.btn.entrar{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;font-size:18px;border-radius:12px;background:linear-gradient(135deg,#4A2574,#6A3D9A);margin-top:10px;box-shadow:0 10px 24px rgba(74,37,116,.28)}
.lema{display:flex;align-items:center;gap:14px;margin:26px 0 0;color:var(--muted);font-size:14px;text-align:center}
.lema::before,.lema::after{content:"";flex:1;height:1px;background:var(--ouro);opacity:.7}
.login-card .faixa{font-size:14px}
.esqueci{display:flex;justify-content:flex-end;margin:-6px 2px 4px;font-size:14px}
.esqueci .link{color:var(--anil2)}
@media (max-width:860px){
  .login-tela{grid-template-columns:1fr}
  .login-arte{min-height:44vh;background-position:74% 38%}
  .login-arte::after{background:linear-gradient(180deg,rgba(255,255,255,0) 62%,#fff 100%)}
  .login-lado{padding:0 16px 32px;margin-top:-60px;position:relative;z-index:1;background:none}
  .login-card{padding:30px 22px 24px}
  .marca-1{font-size:20px}.marca-linha span{font-size:11px;letter-spacing:.14em}
}

/* Senhorita Maria Padilha: preto e vermelho */
.escolhas button.ent-padilha{background:#141114;border-color:#141114;color:#F3ECEC;box-shadow:inset 4px 0 0 #B3121F}
.escolhas button.ent-padilha b{color:#fff}.escolhas button.ent-padilha span{color:#D9C9CB}
.escolhas button.ent-padilha.on{background:#B3121F;border-color:#B3121F;box-shadow:none}
.corpo-padilha{--fundo:#0B0909;background:#0B0909}
.corpo-padilha .cab{background:#000;border-bottom-color:#B3121F}
.tema-padilha{--anil:#B3121F;--anil2:#D11A2A;--ouro:#B3121F;--conta:#E0454F}
.tema-padilha .sec,.tema-padilha .ticket{background:#161213;color:#F3ECEC;box-shadow:0 0 0 1px #2A2023}
.tema-padilha .sec>h2,.tema-padilha .mes-nome,.tema-padilha label,.tema-padilha .ticket dd,.tema-padilha .orient h3{color:#fff}
.tema-padilha .sub,.tema-padilha .meta,.tema-padilha .cal-mes .sem span,.tema-padilha .ticket dt,.tema-padilha .legenda-c,.tema-padilha .vazio{color:#B9AEB0}
.tema-padilha .boas-vindas{background:linear-gradient(135deg,#000,#4A0B13);box-shadow:0 10px 30px rgba(179,18,31,.25)}
.tema-padilha .boas-vindas img,.tema-padilha .ticket-topo img{box-shadow:0 0 0 3px #B3121F}
.tema-padilha .ticket-topo{background:linear-gradient(135deg,#000,#4A0B13)}
.tema-padilha .ticket-corte{border-top-color:#3A2E31}
.tema-padilha .dia{background:#1F1A1B;border-color:#352B2E}.tema-padilha .dia span{color:#EDE5E5}
.tema-padilha .dia:disabled{background:#141011;border-color:transparent}.tema-padilha .dia:disabled span{color:#5B5153}
.tema-padilha .dia.livre{background:#2C1215;border-color:#7A1C24}.tema-padilha .dia.livre i{background:#B3121F;color:#fff}
.tema-padilha .dia.sel,.tema-padilha .dia.livre.sel{background:#B3121F;border-color:#B3121F}.tema-padilha .dia.sel i,.tema-padilha .dia.livre.sel i{background:#fff;color:#B3121F}
.tema-padilha .dia.hoje{border-color:#E0454F}
.tema-padilha .escolhas button{background:#1F1A1B;border-color:#352B2E;color:#EDE5E5}.tema-padilha .escolhas button b,.tema-padilha .escolhas.horas button{color:#fff}.tema-padilha .escolhas button span{color:#B9AEB0}
.tema-padilha .escolhas button.on{background:#B3121F;border-color:#B3121F}
.tema-padilha input,.tema-padilha textarea{background:#1F1A1B;border-color:#3A3033;color:#fff}
.tema-padilha label.chk{color:#E6DCDD}
.tema-padilha .btn{background:#B3121F}.tema-padilha .btn.sec2{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #B3121F}.tema-padilha .btn.sec2:hover{background:#2C1215}
.tema-padilha .btn-ico{background:#2A2124;color:#fff}.tema-padilha .btn-ico:hover{background:#3A2E31}.tema-padilha .btn-ico.perigo{background:#3A1418;color:#FF8A92}
.tema-padilha .passo{background:#B3121F;color:#fff}
.tema-padilha .orient{background:#1F1A1B}
.tema-padilha .item{border-top-color:#2E2528}
.tema-padilha .legenda-c i{background:#2C1215;border-color:#7A1C24}
.tema-padilha .amarelo{background:#3A2E12;color:#F2D58A}.tema-padilha .azul{background:#3A1418;color:#FFB3B9}
.ent-cor-padilha{color:#B3121F;font-weight:600}
.lista-valores{border:1px solid var(--linha);border-radius:12px;padding:2px 12px;margin-bottom:14px;max-height:46vh;overflow:auto}
.lv{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--linha)}
.lv:first-child{border-top:0}
.lv label{margin:0;flex:1}
.lv .v-filho{width:120px;margin:0;text-align:right;flex:0 0 120px}
.lv .v-filho:disabled{background:#F7F4FB;color:#B4B8C6}
.restante{background:#F7F4FB;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.item.feito{opacity:.45}
.mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.post{border:1px solid var(--linha);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;max-height:360px;object-fit:cover;display:block}
.post p{margin:12px 14px 4px}
.post .meta{margin:4px 14px 12px;font-size:13px}
.post .item-a{margin:0 14px 12px}
.ficha{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px;margin:0 0 16px}
.ficha dt{color:var(--muted);font-size:14px}
.ficha dd{margin:0;font-weight:500}
.notas{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin:4px 0 18px}
.notas button{aspect-ratio:1/1;border:1.5px solid var(--linha);border-radius:10px;background:#fff;font-weight:600;font-size:16px;cursor:pointer;color:var(--anil);padding:0}
.notas button.on{background:var(--anil);border-color:var(--anil);color:#fff}
.tema-padilha .notas button{background:#1F1A1B;border-color:#352B2E;color:#fff}.tema-padilha .notas button.on{background:#B3121F;border-color:#B3121F}
#impressao{display:none}
.rel{font-family:var(--sans);color:#1d1726;font-size:12.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rel-cab{display:flex;align-items:center;gap:14px;border-bottom:2px solid #4A2574;padding-bottom:12px;margin-bottom:14px}
.rel-cab img{width:64px;height:64px;border-radius:50%}
.rel-cab b{display:block;font-family:var(--brand);font-size:16px;color:#4A2574;letter-spacing:.04em}
.rel-cab span{display:block;font-family:var(--serif);font-size:21px;font-weight:600}
.rel-cab small{color:#666}
.rel h2{font-size:19px;color:#4A2574;margin:18px 0 6px}
.rel table{width:100%;border-collapse:collapse;margin-bottom:8px}
.rel td,.rel th{border-bottom:1px solid #e3dcec;padding:5px 6px;text-align:left;vertical-align:top}
.rel th{background:#F4EFFA;font-size:11.5px}
.rel-res td:last-child{text-align:right;font-weight:600}
.rel-total{font-size:14px;text-align:right;margin:10px 0 0}
.rel-valor{margin-left:auto;font-family:var(--serif);font-size:26px;font-weight:700;color:#4A2574;border:2px solid #4A2574;border-radius:10px;padding:6px 14px;white-space:nowrap}
.recibo{font-size:15px;line-height:1.75;max-width:175mm}
.rec-txt{margin:20px 0;text-align:justify}
.rec-local{text-align:right;margin-top:26px}
.rec-ass{margin:64px auto 0;width:60%;text-align:center;font-size:13px}
.rec-ass span{display:block;border-top:1px solid #333;margin-bottom:6px}
@media print{@page{size:A4;margin:14mm}html,body{background:#fff!important;padding:0!important}body>*:not(#impressao){display:none!important}#impressao{display:block!important}}
/* menu lateral vertical */
.lateral{position:fixed;top:0;bottom:0;left:0;width:256px;z-index:20;background:linear-gradient(180deg,#341855 0%,#4A2574 55%,#5A2F8A 100%);color:#fff;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;border-right:1px solid rgba(200,161,90,.45)}
.lat-marca{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 6px 20px;margin-bottom:14px;border-bottom:1px solid rgba(200,161,90,.35)}
.lat-marca img{width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--ouro);margin-bottom:6px}
.lat-marca b{font-family:var(--brand);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#E9DDF7;line-height:1.45}
.lat-marca span{font-family:var(--serif);font-size:21px;font-weight:600}
.lat-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.lat-nav button,.lat-sair{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#DCCDEF;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:16px;text-align:left;position:relative}
.lat-nav button:hover,.lat-sair:hover{background:rgba(255,255,255,.09);color:#fff}
.lat-nav button.on{background:#fff;color:var(--anil);font-weight:600;box-shadow:0 6px 16px rgba(20,8,40,.25)}
.lat-nav button.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ouro)}
.lat-sair{margin-top:12px;border-top:1px solid rgba(255,255,255,.14);border-radius:0 0 12px 12px;padding-top:16px}
.menu-btn{background:none;border:0;color:#fff;padding:6px;margin-left:-6px;cursor:pointer;display:flex;border-radius:8px}
.menu-btn:hover{background:rgba(255,255,255,.1)}
.veu{display:none}
@media (min-width:900px){
  .com-lateral #app{padding-left:256px}
  .com-lateral .cab-lat{display:none}
  .com-lateral .pag{padding-top:28px}
}
@media (max-width:899px){
  .lateral{transform:translateX(-100%);transition:transform .25s ease;visibility:hidden}
  .menu-aberto .lateral{transform:none;visibility:visible;box-shadow:12px 0 40px rgba(20,8,40,.35)}
  .menu-aberto .veu{display:block;position:fixed;inset:0;background:rgba(30,16,48,.5);z-index:19}
  .menu-aberto{overflow:hidden}
}
@media (prefers-reduced-motion:reduce){.lateral{transition:none}}
.lat-instalar{display:flex;align-items:center;gap:12px;width:100%;background:rgba(200,161,90,.16);border:1px solid rgba(200,161,90,.55);color:#F3E7CF;padding:11px 14px;border-radius:12px;cursor:pointer;font-size:15px;margin-top:12px;text-align:left}
.lat-instalar:hover{background:rgba(200,161,90,.28);color:#fff}
.instalar-login{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;background:#F4EFFA;border:1px dashed #C9B3E6;color:var(--anil);border-radius:12px;padding:11px;cursor:pointer;font-size:15px}
.instalar-login:hover{background:#EDE3F8}
.passos{margin:0 0 12px;padding-left:22px;display:grid;gap:10px}
.links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.link-card{background:var(--branco);border-radius:18px;padding:20px;display:flex;gap:18px;align-items:flex-start;box-shadow:0 1px 2px rgba(74,37,116,.06);flex-wrap:wrap}
.valor-mes{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--linha)}
.valor-mes label{margin:0;flex:0 1 200px}
.valor-mes label:nth-child(2){flex-basis:130px}
.hist-valores{margin:4px 0 0;font-size:14px}
.qr-mini img{width:64px;height:64px;image-rendering:pixelated;border:1px solid var(--linha);border-radius:8px;display:block}
.item-link{align-items:center}
.item-link .item-p{flex-basis:200px}
.cl[hidden]{display:none}
.qr-link img{width:132px;height:132px;image-rendering:pixelated;border:1px solid var(--linha);border-radius:12px;display:block}
.link-info{flex:1 1 220px;min-width:0}
.link-info h3{font-size:24px;color:var(--anil)}
.link-info .sub{margin:4px 0 10px}
.url,.url-curta{word-break:break-all;font-size:14px}
.url{background:#F7F4FB;border-radius:10px;padding:8px 10px;margin-bottom:12px;color:var(--cafe)}
.cartaz{text-align:center;padding:10mm 8mm;font-family:var(--sans);color:#1d1726}
.cartaz-logo{width:120px;height:120px;border-radius:50%}
.cartaz-casa{font-family:var(--brand);letter-spacing:.12em;text-transform:uppercase;color:#4A2574;margin:10px 0 4px;font-size:14px}
.cartaz h1{font-family:var(--serif);font-size:40px;color:#4A2574;margin:4px 0 18px}
.cartaz-qr img{width:90mm;height:90mm;image-rendering:pixelated}
.cartaz-txt{font-size:17px;max-width:150mm;margin:16px auto 8px}
.cartaz-url{font-size:12px;color:#666;word-break:break-all}
@media (max-width:520px){.ficha{grid-template-columns:1fr}.ficha dd{margin-bottom:6px}
.sec{padding:16px}.boas-vindas{padding:18px}.boas-vindas img{width:64px;height:64px;flex-basis:64px}.boas-vindas h2{font-size:23px}.conta-card .valor{font-size:34px}}
</style>

const dig = s => String(s || '').replace(/\D/g, '');
const normTel = t => { let d = dig(t); if (d.startsWith('55') && d.length > 11) d = d.slice(2); return d; };
const num = v => { let s = String(v ?? '').trim(); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s) || 0; };
const brl = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = v => Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const brlCurto = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {maximumFractionDigits: Number(v) % 1 ? 2 : 0});
const p2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const hoje = () => iso(new Date());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const fmtData = s => s ? pd(s).toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'}) : '';
const fmtCurta = s => s ? pd(s.slice(0,10)).toLocaleDateString('pt-BR') : '';
const compLabel = c => { const [y,m] = c.split('-'); return new Date(+y, +m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); };
const fmtTel = t => { const d = normTel(t); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t || ''; };
const wa = (t, msg) => `https://wa.me/${t ? '55' + normTel(t) : ''}?text=${encodeURIComponent(msg)}`;
const toMin = h => { const [a,b] = h.split(':').map(Number); return a*60 + b; };
const sum = arr => Math.round(arr.reduce((a, c) => a + Number((c && c.valor) || 0), 0) * 100) / 100;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3400); }

function baixarArq(conteudo, nome, tipo) { const b = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type:tipo}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
function dataUrlBlob(d) { const [h, b] = d.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:mime}); }

/* ---------- PIX copia e cola (BR Code) ---------- */
function pixChave(k, tipo) { const d = dig(k); if (tipo === 'telefone') { let n = d; if (n.startsWith('55') && n.length > 11) n = n.slice(2); return '+55' + n; } if (tipo === 'cpf' || tipo === 'cnpj') return d; return String(k || '').trim(); }
const emv = (id, v) => id + p2(v.length) + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function brcode(chave, tipo, valor, nome, cidade) {
  const limpa = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim();
  let p = emv('00','01') + emv('26', emv('00','br.gov.bcb.pix') + emv('01', pixChave(chave, tipo))) + emv('52','0000') + emv('53','986')
    + (valor > 0 ? emv('54', Number(valor).toFixed(2)) : '') + emv('58','BR') + emv('59', limpa(nome).slice(0,25) || 'RECEBEDOR') + emv('60', limpa(cidade).slice(0,15) || 'BRASIL') + emv('62', emv('05','***')) + '6304';
  return p + crc16(p);
}
function qrImg(txt) { try { const q = qrcode(0, 'M'); q.addData(txt); q.make(); return q.createImgTag(5, 8, 'QR Code PIX'); } catch (e) { return ''; } }

/* ---------- banco de dados ---------- */
const COLS_TODAS = ['filhos','cobrancas','avisos','entidades','consultas','config','produtos','mural','espera','links'];
const COLS = {mae:COLS_TODAS, filho:['filhos','cobrancas','avisos','config','mural'], consulta:['entidades','consultas','config']}[PORTAL];
const DB = {
  cache:{}, mode:'local', fs:null, erro:false,
  async init() {
    COLS_TODAS.forEach(c => this.cache[c] = {});
    if (FIREBASE_CONFIG && window.firebase) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        this.fs = firebase.firestore();
        if (APP) try { await this.fs.enablePersistence({synchronizeTabs:true}); } catch (e) { console.warn('Sem cache offline:', e.code); }
        this.mode = 'firebase';
        await Promise.all(COLS.map(c => new Promise(res => {
          let primeira = true;
          this.fs.collection(c).onSnapshot(snap => {
            const m = {}; snap.forEach(d => m[d.id] = {id:d.id, ...d.data()});
            this.cache[c] = m; this.erro = false;
            if (primeira) { primeira = false; res(); } else this.emit();
          }, err => { console.error(c, err); this.erro = true; res(); });
        })));
        if (PORTAL === 'mae' && firebase.auth) await new Promise(res => {
          let p = true;
          firebase.auth().onAuthStateChanged(u => {
            S.mae = !!u; S.usuario = u ? u.email : '';
            if (u) aposLogin();
            if (p) { p = false; res(); } else render();
          });
        });
        return;
      } catch (e) { console.error('Firebase indisponível.', e); this.mode = 'local'; }
    }
    this.erro = true;
    S.mae = sessionStorage.getItem('cv_mae') === '1';
    try { const raw = localStorage.getItem('cvca_db'); if (raw) Object.assign(this.cache, JSON.parse(raw)); } catch (e) {}
    COLS_TODAS.forEach(c => this.cache[c] = this.cache[c] || {});
  },
  all(c) { return Object.values(this.cache[c] || {}); },
  get(c, id) { return (this.cache[c] || {})[id]; },
  async set(c, id, data) {
    id = id || uid(); const doc = {...data}; delete doc.id;
    if (this.mode === 'firebase') await this.fs.collection(c).doc(id).set(doc);
    this.cache[c][id] = {id, ...doc}; this.persist(); this.emit(); return id;
  },
  async update(c, id, patch) {
    if (this.mode === 'firebase') await this.fs.collection(c).doc(id).set(patch, {merge:true});
    this.cache[c][id] = {...this.cache[c][id], ...patch}; this.persist(); this.emit();
  },
  async del(c, id) {
    if (this.mode === 'firebase') await this.fs.collection(c).doc(id).delete();
    delete this.cache[c][id]; this.persist(); this.emit();
  },
  async reserve(c, id, data) {
    const cur = this.get(c, id);
    if (cur && cur.status !== 'cancelada') return false;
    if (this.mode === 'firebase') {
      const ref = this.fs.collection(c).doc(id);
      const ok = await this.fs.runTransaction(async t => {
        const s = await t.get(ref);
        if (s.exists && s.data().status !== 'cancelada') return false;
        t.set(ref, data); return true;
      });
      if (!ok) return false;
    }
    this.cache[c][id] = {id, ...data}; this.persist(); this.emit(); return true;

      const comp = `${ano}-${p2(i+1)}`;
      const l = cobs.filter(c => c.filhoId === f.id && c.competencia === comp);
      if (!l.length) return `<td><button class="cel vazia" onclick="celula('${f.id}','${k}','${comp}')" aria-label="${esc(f.nome)}, ${MESES_L[i]}: sem cobrança">·</button></td>`;
      const st = pior(l), ab = sum(naoPagas(l)), pg = sum(l.filter(c => c.status === 'pago'));
      tot[i].rec += pg; tot[i].abr += ab; abertoF += ab;
      return `<td><button class="cel ${st}" onclick="celula('${f.id}','${k}','${comp}')" aria-label="${esc(f.nome)}, ${MESES_L[i]}: ${ST[st]}">${st === 'pago' ? 'Pago' : st === 'conferir' ? 'Conferir' : brlCurto(ab)}</button></td>`;
    }).join('');
    return `<tr><th scope="row"><button class="nome-f" onclick="calendarioFilho('${f.id}')">${esc(f.nome)}</button></th>${cels}<td class="tot ${abertoF ? 'devendo' : ''}">${abertoF ? brl(abertoF) : 'Em dia'}</td></tr>`;
  }).join('');
  const tr = tot.reduce((a, t) => a + t.rec, 0), ta = tot.reduce((a, t) => a + t.abr, 0);
  return `<div class="cal-wrap"><table class="cal-ano"><thead><tr><th>Filho</th>${MESES.map((m, i) => `<th class="${`${ano}-${p2(i+1)}` === agora ? 'mes-atual' : ''}">${m}</th>`).join('')}<th>Em aberto</th></tr></thead>
  <tbody>${linhas}</tbody>
  <tfoot><tr><th>Recebido</th>${tot.map(t => `<td>${t.rec ? brlCurto(t.rec) : '·'}</td>`).join('')}<td>${brl(tr)}</td></tr>
  <tr><th>A receber</th>${tot.map(t => `<td class="${t.abr ? 'devendo' : ''}">${t.abr ? brlCurto(t.abr) : '·'}</td>`).join('')}<td class="devendo">${brl(ta)}</td></tr></tfoot></table></div>`;
}

async function salvarCfg(e) {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), atual = cfg();
  const novo = {...atual};
  ['casa','endereco','cidade','pixMensalidade','tipoPixMensalidade','nomeLoja','pixLoja','tipoPixLoja','orientacoes','linkFilhos','linkConsulta'].forEach(k => novo[k] = String(d[k] || '').trim());
  novo.telCasa = normTel(d.telCasa); novo.valorPadrao = num(d.valorPadrao); novo.diaVenc = Math.min(31, Math.max(1, parseInt(d.diaVenc) || 10));
  delete novo.pix; delete novo.senhaMae;
  try { await DB.set('config', 'casa', novo); toast('Configurações salvas.'); }
  catch (err) { console.error(err); toast('Não foi possível salvar. Verifique a internet.'); }
  return false;
}
async function trocarSenha(e) {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  if (d.nova.length < 6) { toast('A nova senha precisa ter pelo menos 6 caracteres.'); return false; }
  if (d.nova !== d.rep) { toast('As duas senhas novas não são iguais.'); return false; }
  try {
    if (temAuth()) {
      const u = firebase.auth().currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, d.atual));
      await u.updatePassword(d.nova);
    } else {
      if (d.atual !== senhaLocal()) { toast('Senha atual incorreta.'); return false; }
      localStorage.setItem('cv_senha_local', d.nova);
    }
    e.target.reset(); toast('Senha alterada.');
  } catch (err) { console.error(err); toast(['auth/invalid-credential','auth/wrong-password','auth/invalid-login-credentials'].includes(err.code) ? 'Senha atual incorreta.' : msgAuth(err)); }
  return false;
}

async function agendar(ev) {
  ev.preventDefault();
  const A = S.ag, tel = normTel(A.tel);
  if (!(A.nome || '').trim()) { toast('Informe seu nome.'); return false; }
  if (tel.length < 10) { toast('Informe o celular com DDD, ex.: (45) 99999-9999.'); return false; }
  if (!A.lgpd) { toast('Marque a autorização para continuar.'); return false; }
  if (DB.all('consultas').some(c => normTel(c.tel) === tel && c.data === A.data && c.status !== 'cancelada')) { toast('Este celular já tem uma consulta marcada neste dia. Veja em "Já agendou?", no fim da página.'); return false; }
  const id = `${A.ent}_${A.data}_${A.hora.replace(':','')}`;
  const protocolo = `VC${A.data.slice(2).replace(/-/g,'')}-${A.hora.replace(':','')}${rnd(2)}`;
  const btn = ev.target.querySelector('button.btn'); btn.disabled = true;
  try {
    const ok = await DB.reserve('consultas', id, {entidadeId:A.ent, data:A.data, hora:A.hora, nome:A.nome.trim(), tel, motivo:(A.motivo || '').trim(), protocolo, lgpd:true, valor:Number((DB.get('entidades', A.ent) || {}).valor) || 0, status:'agendada', criadoEm:new Date().toISOString()});
    if (!ok) { toast('Esse horário acabou de ser ocupado. Escolha outro.'); S.ag.hora = null; render(); return false; }
    try { localStorage.setItem('cv_meu_tel', tel); } catch (e) {}
    S.minhasTel = tel; S.consultaFeita = id; S.ag = {}; render(); scrollTo(0,0);
  } catch (e) { console.error(e); toast('Não foi possível agendar. Verifique a internet e tente de novo.'); btn.disabled = false; }
  return false;
}
function buscarMinhas(e) {

const FORMAS = {pix:'PIX', dinheiro:'Dinheiro', cartao:'Cartão'};
const selForma = (v = 'pix') => `<select name="forma">${Object.entries(FORMAS).map(([k, n]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
const valorMensal = f => Math.round((f.valor || num(cfg().valorPadrao)) * (1 - (Number(f.desconto) || 0) / 100) * 100) / 100;
const nomeF = x => (DB.get('filhos', x.filhoId) || {nome:'(cadastro excluído)'}).nome;
const formasTxt = l => { const p = Object.keys(FORMAS).map(f => [FORMAS[f], sum(l.filter(x => (x.forma || 'pix') === f))]).filter(x => x[1]); return p.length ? ` <small>(${p.map(([n, v]) => n + ' ' + brl(v)).join(', ')})</small>` : ''; };
const cidadeTxt = () => String(cfg().cidade || 'Foz do Iguaçu').replace(/Iguacu$/i, 'Iguaçu');

function lerArquivo(file, opt = {}) {
  const max = opt.max || 1400, limite = opt.limite || 850000;
  return new Promise((res, rej) => {
    if (file.type === 'application/pdf') {
      if (opt.pdf === false) return rej(new Error('Escolha uma foto (JPG ou PNG).'));
      if (file.size > 650000) return rej(new Error('PDF muito grande (máximo 650 KB). Envie uma foto ou print do comprovante.'));
      const r = new FileReader(); r.onload = () => res({mime:'application/pdf', dados:r.result}); r.onerror = () => rej(new Error('Não foi possível ler o PDF.')); r.readAsDataURL(file); return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = .8, d = cv.toDataURL('image/jpeg', q);
      while (d.length > limite && q > .3) { q -= .1; d = cv.toDataURL('image/jpeg', q); }
      res({mime:'image/jpeg', dados:d});
    };
    img.onerror = () => rej(new Error('Não foi possível ler a imagem. Tente uma foto ou print em JPG ou PNG.'));
    img.src = url;
  });
}

function extenso(v) {
  const u = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dz = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const ct = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = n => { if (!n) return ''; if (n === 100) return 'cem'; const p = [], c = Math.floor(n / 100), r = n % 100; if (c) p.push(ct[c]); if (r) p.push(r < 20 ? u[r] : dz[Math.floor(r / 10)] + (r % 10 ? ' e ' + u[r % 10] : '')); return p.join(' e '); };
  const int = Math.floor(v + 1e-9), cent = Math.round((v - int) * 100), mil = Math.floor(int / 1000), resto = int % 1000;
  let r = [mil ? (mil === 1 ? 'mil' : ate999(mil) + ' mil') : '', ate999(resto)].filter(Boolean).join(mil && resto && (resto < 100 || resto % 100 === 0) ? ' e ' : ' ');
  if (int) r += int === 1 ? ' real' : ' reais';
  if (cent) r += (int ? ' e ' : '') + ate999(cent) + (cent === 1 ? ' centavo' : ' centavos');
  return r || 'zero real';
}

function gerarCobrancas() {
  const c = cfg(), ativos = DB.all('filhos').filter(f => f.ativo !== false).sort(byNome);

  const ja = new Set(DB.all('cobrancas').filter(x => contaDe(x) === 'mensalidade' && x.competencia === S.comp && x.tipo !== 'avulsa').map(x => x.filhoId));
  if (ativos.every(f => ja.has(f.id))) return toast('Todos os filhos ativos já têm a mensalidade deste mês.');
  const [y, m] = S.comp.split('-').map(Number);
  const venc = `${S.comp}-${p2(Math.min(Number(c.diaVenc) || 10, new Date(y, m, 0).getDate()))}`;
  const nota = f => f.isento ? '<br><small>isento de mensalidade</small>' : f.desconto ? `<br><small>desconto de ${String(f.desconto).replace('.', ',')}%</small>` : '';
  modal(`Mensalidade de ${compLabel(S.comp)}`, `
    <div class="grade"><label>Valor para todos (R$)<input inputmode="decimal" placeholder="Ex.: ${fmtNum(c.valorPadrao)}" oninput="document.querySelectorAll('.v-filho:not(:disabled)').forEach(i => i.value = this.value)"></label>
    <label>Vencimento<input type="date" name="venc" required value="${venc}"></label></div>
    <p class="sub">Defina o valor da cobrança de cada filho. Desmarque quem não deve ser cobrado neste mês.</p>
    <div class="lista-valores">${ativos.map(f => { const tem = ja.has(f.id); return `<div class="lv"><label class="chk"><input type="checkbox" name="f_${f.id}" ${tem ? 'disabled' : f.isento ? '' : 'checked'}><span>${esc(f.nome)}${tem ? '<br><small>já tem a mensalidade deste mês</small>' : nota(f)}</span></label><input class="v-filho" name="v_${f.id}" inputmode="decimal" value="${fmtNum(valorMensal(f))}" ${tem ? 'disabled' : ''} aria-label="Valor de ${esc(f.nome)}"></div>`; }).join('')}</div>
    <label class="chk"><input type="checkbox" name="guardar"><span>Usar estes valores como mensalidade de cada filho nos próximos meses</span></label>`,
  async (d, form) => {
    const sel = ativos.filter(f => !ja.has(f.id) && form.querySelector(`[name="f_${f.id}"]`).checked);
    if (!sel.length) { toast('Marque pelo menos um filho.'); return false; }
    const semValor = sel.find(f => !num(d['v_' + f.id]));
    if (semValor) { toast(`Informe o valor de ${semValor.nome}.`); return false; }
    for (const f of sel) {
      const v = num(d['v_' + f.id]);
      await DB.set('cobrancas', null, {conta:'mensalidade', filhoId:f.id, competencia:S.comp, valor:v, venc:d.venc, status:'pendente', tipo:'mensal', criadoEm:new Date().toISOString()});

function frequencia(fid) {
  const f = DB.get('filhos', fid) || {};
  const l = DB.all('avisos').filter(a => a.frequencia && a.data && a.data <= hoje() && a.data >= (f.entrada || '')).sort(ordAviso).reverse();
  const pres = l.filter(a => (a.presentes || []).includes(fid)).length;
  return {total:l.length, pres, lista:l, pct:l.length ? Math.round(pres / l.length * 100) : 0};
}

/* --- Agenda da casa: presença real --- */
function rowAviso(a, modo) {
  const t = TIPOS[a.tipo] || TIPOS.comunicado, pres = a.presencas || {};
  const sim = Object.values(pres).filter(v => v === 'sim').length, nao = Object.values(pres).filter(v => v === 'nao').length;
  let acoes = '';
  if (modo === 'mae') {
    acoes = `<a class="btn-ico" target="_blank" rel="noopener" href="${wa('', msgAviso(a))}">Enviar no WhatsApp</a>${a.convoca ? `<button class="btn-ico" onclick="verPresencas('${a.id}')">Confirmações: ${sim} vão, ${nao} não</button>` : ''}`
      + (a.data && a.data <= hoje() ? `<button class="btn-ico ${a.frequencia ? 'ok' : ''}" onclick="listaPresenca('${a.id}')">${a.frequencia ? `Lista de presença: ${(a.presentes || []).length}` : 'Fazer lista de presença'}</button>` : '')
      + `<button class="btn-ico" onclick="formAviso('${a.id}')">Editar</button>`;

  <div class="aviso-c"><span class="tipo">${t.n}${a.convoca ? ', presença pedida' : ''}</span><h3>${esc(a.titulo)}</h3>${dt ? `<span class="meta">${cap(fmtData(a.data))}${a.hora ? ' às ' + a.hora : ''}</span>` : ''}${a.texto ? `<p>${esc(a.texto).replace(/\n/g, '<br>')}</p>` : ''}${acoes ? `<div class="item-a">${acoes}</div>` : ''}</div></article>`;

function listaPresenca(id) {

/* --- Valor da mensalidade (muda quando a casa decidir) --- */
function valorMensalHTML() {
  const c = cfg(), hist = (c.historicoValores || []).slice(-4).reverse();
  return `<div class="valor-mes"><label>Valor da mensalidade (R$)<input id="vPadrao" inputmode="decimal" value="${fmtNum(c.valorPadrao)}"></label>
    <label>Vence todo dia<input id="vDia" type="number" min="1" max="31" value="${c.diaVenc}"></label>
    <button class="btn sec2" onclick="salvarValorMensal()">Alterar valor</button></div>
    <p class="sub" style="margin:8px 0 0">Vale a partir de ${compLabel(S.comp)} para as mensalidades geradas. Filhos com valor próprio, desconto ou isenção seguem a regra da ficha deles.</p>
    ${hist.length ? `<p class="sub hist-valores">Histórico: ${hist.map(h => h.desde === '0000-00' ? `${brl(h.valor)} antes disso` : `${brl(h.valor)} desde ${compLabel(h.desde)}`).join('; ')}.</p>` : ''}`;
}
function salvarValorMensal() {
  const c = cfg(), v = num($('#vPadrao').value), dia = Math.min(31, Math.max(1, parseInt($('#vDia').value) || c.diaVenc));
  if (!v) return toast('Informe o valor da mensalidade.');
  if (v === Number(c.valorPadrao) && dia === Number(c.diaVenc)) return toast('O valor e o vencimento já são estes.');
  const pend = DB.all('cobrancas').filter(x => contaDe(x) === 'mensalidade' && x.tipo === 'mensal' && x.competencia >= S.comp && x.status === 'pendente' && !x.motivoRecusa && (() => { const f = DB.get('filhos', x.filhoId); return f && !f.valor; })());
  modal('Alterar a mensalidade', `<p>A mensalidade passa de <b>${brl(c.valorPadrao)}</b> para <b>${brl(v)}</b>${dia !== Number(c.diaVenc) ? `, com vencimento todo dia ${dia}` : ''}, a partir de <b>${compLabel(S.comp)}</b>.</p>
    ${pend.length ? `<label class="chk"><input type="checkbox" name="aplicar" checked><span>Atualizar também ${pend.length} mensalidade(s) em aberto de ${compLabel(S.comp)} em diante, que ainda estão no valor antigo<br><small>Pagas, em conferência e de filhos com valor próprio não mudam.</small></span></label>` : '<p class="sub">Nenhuma mensalidade em aberto será alterada.</p>'}`,
  async d => {
    const hist = (c.historicoValores || []).filter(h => h.desde !== S.comp);
    if (!hist.length) hist.push({desde:'0000-00', valor:Number(c.valorPadrao)});
    hist.push({desde:S.comp, valor:v, em:new Date().toISOString()});
    hist.sort((a, b) => a.desde.localeCompare(b.desde));
    await DB.set('config', 'casa', {...c, valorPadrao:v, diaVenc:dia, historicoValores:hist});
    let n = 0;
    if (d.aplicar) for (const x of pend) { const f = DB.get('filhos', x.filhoId); if (f.isento) continue; const novo = valorMensal(f); if (novo !== x.valor) { await DB.update('cobrancas', x.id, {valor:novo}); n++; } }
    toast(`Mensalidade alterada para ${brl(v)}.${n ? ` ${n} cobrança(s) em aberto atualizada(s).` : ''}`);
  }, '', 'Confirmar alteração');
}

/* --- Links automáticos e QR Codes --- */
const linkEntidade = id => { const u = new URL(linkPortal('consulta')); u.searchParams.set('entidade', id); return u.href; };
function qrGrande(txt) { try { const q = qrcode(0, 'M'); q.addData(txt); q.make(); return q.createImgTag(8, 16, 'QR Code'); } catch (e) { return ''; } }
const slug = t => String(t || 'link').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'link';
const TIPOS_LINK = {consulta:'Agendamento de consultas', entidade:'Agendamento com uma entidade', filho:'Portal dos Filhos', whatsapp:'Conversa no WhatsApp', externo:'Outro endereço (Instagram, localização, site)'};
function urlDoLink(l) {
  if (l.tipo === 'consulta') return linkPortal('consulta');
  if (l.tipo === 'filho') return linkPortal('filho');
  if (l.tipo === 'entidade') return linkEntidade(l.entidadeId);
  if (l.tipo === 'whatsapp') return `https://wa.me/55${normTel(l.tel)}${l.msg ? '?text=' + encodeURIComponent(l.msg) : ''}`;
  return l.url || '';
}
function baixarQR(url, nome) {
  try {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const cel = 14, mg = cel * 4, n = q.getModuleCount(), tam = n * cel + mg * 2;
    const cv = document.createElement('canvas'); cv.width = cv.height = tam;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, tam, tam); cx.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) cx.fillRect(mg + c * cel, mg + r * cel, cel, cel);
    cv.toBlob(b => { baixarArq(b, `qrcode-${slug(nome)}.png`); toast('QR Code baixado.'); }, 'image/png');
  } catch (e) { console.error(e); toast('Não foi possível gerar o QR Code.'); }
}
function imprimirCartaz(titulo, texto, url) {
  const c = cfg();
  imprimir(`<div class="cartaz"><img class="cartaz-logo" src="${LOGO}" alt=""><p class="cartaz-casa">${esc(c.casa)}</p><h1>${esc(titulo)}</h1><div class="cartaz-qr">${qrGrande(url)}</div><p class="cartaz-txt">${esc(texto)}</p><p class="cartaz-url">${esc(url)}</p></div>`, titulo);
}
function imprimirQR(k, entId) {

/* ações dos links: fixos (filho, consulta), de entidade (ent:ID) e criados pela Mãe (ID) */
function dadosLink(ref) {
  const c = cfg();
  if (ref === 'filho') return {nome:'Portal dos Filhos', url:linkPortal('filho'), msg:`Axé! Este é o portal dos filhos da ${c.casa}: ${linkPortal('filho')}\nEntre com o seu número de celular.`};
  if (ref === 'consulta') return {nome:'Agendamento', url:linkPortal('consulta'), msg:`Agende sua consulta com as entidades da ${c.casa}: ${linkPortal('consulta')}`};
  if (ref.startsWith('ent:')) { const e = DB.get('entidades', ref.slice(4)) || {nome:''}; return {nome:e.nome, url:linkEntidade(e.id), msg:`Agende sua consulta com ${e.nome} na ${c.casa}: ${linkEntidade(e.id)}`}; }
  const l = DB.get('links', ref) || {}; const url = urlDoLink(l);
  return {nome:l.nome, url, msg:`${l.texto || l.nome}: ${url}`, l};
}
function acaoLink(ref, acao) {
  const d = dadosLink(ref);
  if (acao === 'copiar') copiar(d.url, 'Link copiado.');
  else if (acao === 'qr') baixarQR(d.url, d.nome);
  else if (acao === 'whats') window.open(wa('', d.msg), '_blank', 'noopener');
  else if (acao === 'cartaz') {
    if (ref === 'filho' || ref === 'consulta') imprimirQR(ref);
    else if (ref.startsWith('ent:')) imprimirQR('consulta', ref.slice(4));
    else imprimirCartaz(d.nome, d.l.texto || 'Aponte a câmera do celular para abrir.', d.url);
  }
}
const botoesLink = (ref, url) => `<button class="btn-ico" onclick="acaoLink('${ref}','copiar')">Copiar link</button><a class="btn-ico" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a><button class="btn-ico" onclick="acaoLink('${ref}','whats')">Enviar no WhatsApp</button><button class="btn-ico" onclick="acaoLink('${ref}','qr')">Baixar QR Code</button><button class="btn-ico" onclick="acaoLink('${ref}','cartaz')">Imprimir cartaz</button>`;
function mLinks() {
  const itens = [['filho','Portal dos Filhos','Mensalidades, conta da loja, agenda e mural. Cada filho entra com o celular cadastrado.'], ['consulta','Agendamento de consultas','Página aberta para os consulentes marcarem consulta com as entidades.']];
  const ents = DB.all('entidades').filter(e => e.ativa !== false).sort(byNome);
  const meus = DB.all('links').sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
  return `<section class="sec"><div class="cal-cab"><h2>Links e QR Codes</h2><button class="btn" onclick="formLink()">Criar novo link</button></div><p class="sub">Todos os links e QR Codes são criados automaticamente. Se os portais estiverem em outro endereço, ajuste em Configurações.</p></section>
  <div class="links-grid">${itens.map(([k, t, d]) => `<article class="link-card"><div class="qr-link">${qrImg(linkPortal(k))}</div><div class="link-info"><h3>${t}</h3><p class="sub">${d}</p><div class="url">${esc(linkPortal(k))}</div><div class="item-a">${botoesLink(k, linkPortal(k))}</div></div></article>`).join('')}</div>
  <section class="sec"><div class="cal-cab"><h2>Meus links</h2><button class="btn-ico" onclick="formLink()">Criar novo link</button></div><p class="sub">Links para o que a casa precisar: Instagram, localização, WhatsApp, uma festa ou a agenda de uma entidade. O QR Code de cada um aparece na hora.</p>
    ${meus.length ? meus.map(l => { const url = urlDoLink(l), e = l.tipo === 'entidade' && DB.get('entidades', l.entidadeId); return `<div class="item item-link"><div class="qr-mini">${qrImg(url)}</div><div class="item-p"><b>${esc(l.nome)}</b><span class="meta">${TIPOS_LINK[l.tipo] || ''}${e ? ': ' + esc(e.nome) : ''}</span><span class="meta url-curta">${esc(url)}</span></div><div class="item-a">${botoesLink(l.id, url)}<button class="btn-ico" onclick="formLink('${l.id}')">Editar</button></div></div>`; }).join('') : '<p class="vazio">Nenhum link criado ainda. Toque em "Criar novo link".</p>'}</section>
  ${ents.length ? `<section class="sec"><h2>Link direto de cada entidade</h2><p class="sub">Abre o agendamento com a entidade já escolhida. Criado automaticamente para cada entidade cadastrada.</p>
    ${ents.map(e => `<div class="item item-link"><div class="qr-mini">${qrImg(linkEntidade(e.id))}</div><div class="item-p"><b class="${ehPadilha(e) ? 'ent-cor-padilha' : ''}">${esc(e.nome)}</b><span class="meta url-curta">${esc(linkEntidade(e.id))}</span></div><div class="item-a">${botoesLink('ent:' + e.id, linkEntidade(e.id))}</div></div>`).join('')}</section>` : ''}`;
}
function formLink(id) {
  const l = id ? DB.get('links', id) : {tipo:'externo'}, c = cfg(), ents = DB.all('entidades').sort(byNome);
  modal(id ? 'Editar link' : 'Criar novo link', `
    <label>Nome do link<input name="nome" required value="${esc(l.nome)}" placeholder="Ex.: Instagram da casa, Festa de Cosme e Damião"></label>
    <label>Para onde o link leva<select name="tipo" onchange="camposLink(this.value)">${Object.entries(TIPOS_LINK).map(([k, n]) => `<option value="${k}" ${l.tipo === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="cl cl-entidade"><label>Entidade<select name="entidadeId">${ents.map(e => `<option value="${e.id}" ${l.entidadeId === e.id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></label></div>
    <div class="cl cl-whatsapp"><label>Celular (WhatsApp)<input name="tel" inputmode="tel" value="${esc(fmtTel(l.tel || c.telCasa))}" placeholder="(45) 99999-9999"></label><label>Mensagem que já vem escrita (opcional)<input name="msg" value="${esc(l.msg)}" placeholder="Ex.: Olá! Quero saber sobre a gira de sexta."></label></div>
    <div class="cl cl-externo"><label>Endereço do link<input name="url" inputmode="url" value="${esc(l.url)}" placeholder="Ex.: https://instagram.com/casavovochica"></label><p class="sub" style="margin-top:-6px">Pode ser o Instagram, a localização no Google Maps, um site ou qualquer outro link.</p></div>
    <label>Texto do cartaz (opcional)<input name="texto" value="${esc(l.texto)}" placeholder="Ex.: Siga a casa no Instagram"></label>`,
  async d => {
    const novo = {nome:d.nome.trim(), tipo:d.tipo, texto:(d.texto || '').trim(), criadoEm:l.criadoEm || new Date().toISOString()};
    if (d.tipo === 'entidade') { if (!d.entidadeId) { toast('Cadastre uma entidade primeiro.'); return false; } novo.entidadeId = d.entidadeId; }
    if (d.tipo === 'whatsapp') { const t = normTel(d.tel); if (t.length < 10) { toast('Informe o celular com DDD.'); return false; } novo.tel = t; novo.msg = (d.msg || '').trim(); }
    if (d.tipo === 'externo') { let u = (d.url || '').trim(); if (!u) { toast('Informe o endereço do link.'); return false; } if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { new URL(u); } catch (e) { toast('Endereço inválido. Confira o link.'); return false; } novo.url = u; }
    await DB.set('links', id, novo);
    toast(id ? 'Link atualizado.' : 'Link criado. O QR Code já está pronto.');
  }, id ? `<button type="button" class="btn perigo" onclick="excluir('links','${id}','Excluir este link? Quem já tem o QR Code impresso continua acessando o endereço, mas ele some desta lista.')">Excluir</button>` : '', id ? 'Salvar' : 'Criar link');
  camposLink(l.tipo);
}
function camposLink(t) { document.querySelectorAll('#mf .cl').forEach(e => e.hidden = !e.classList.contains('cl-' + t)); }

/* ---------- início ---------- */
(async () => {
  try { await DB.init(); } catch (e) { console.error(e); }
  render();
})();
</script>
</body>
</html>
